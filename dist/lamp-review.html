<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>灯具质感预览</title><style>body{margin:0;background:#080909;color:#c4c3bb;font:13px system-ui}header{padding:28px 6vw;display:flex;justify-content:space-between;align-items:center}a{color:#92938b;text-decoration:none}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:1px;background:#252623;margin:0 5vw 40px}article{background:#080909;padding:20px 10px;text-align:center}h2{font-size:12px;font-weight:400;letter-spacing:.05em}canvas{width:100%;height:180px;display:block}p{display:flex;justify-content:space-around;font-size:10px;color:#73766e}</style><header><span>十八款灯具 · 质感预览</span><a href="./">进入原型 ↗</a></header><main></main><script src="realistic-fixtures.js"></script><script src="designer-fixtures.js"></script><script src="refined-fixtures.js"></script><script src="disco-ball.js"></script><script src="fixtures.js"></script><script>
const names={dome:'经典半球',modern:'现代薄碟',red:'暗红浅穹',glass:'烟灰玻璃',tube:'极简筒灯',vintage:'复古黄铜',capsule:'香槟胶囊',ph5:'PH 5',caravaggio:'Caravaggio',gubi1965:'GUBI Semi',jazz:'Jazz',disco:'Disco · special'};
const views=Object.entries(names).map(([key,name])=>{const a=document.createElement('article');a.innerHTML='<h2>'+name+'</h2><canvas></canvas>';document.querySelector('main').append(a);const c=a.querySelector('canvas');c.width=720;c.height=360;return{key,c,g:c.getContext('2d')};});
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function frame(now){for(const {key,c,g}of views){g.clearRect(0,0,c.width,c.height);for(let i=0;i<1;i++){const angle=reduced?0:Math.sin(now*.00065)*.055;g.save();g.translate(360,60);g.rotate(angle);g.scale(2.7,2.7);g.strokeStyle='#4b4b43';g.lineWidth=.4;g.beginPath();g.moveTo(0,-25);g.lineTo(0,0);g.stroke();const lens=drawFixture(g,key,null,{realistic:true,yaw:angle,pitch:0,time:reduced?0:now/1000});drawFixtureLight(g,lens);g.restore();}}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
